name: Launcher release

# Started by hand only. Builds the bundles the launcher updates from:
#   windows-x64: vi-launcher.exe and victory\victory.exe
#   linux-x64:   vi-launcher and victory/victory.exe (started through Wine or Proton)
# and the manifest latest.json that names each bundle's address, size and
# SHA-256. With publish off (the default) they are only kept as artifacts to
# look at. With publish on, the GitHub release v<version> is made with the
# bundles and latest.json, and latest.json goes to GitHub Pages, where the
# launcher looks first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (for example 0.2.0)"
        required: true
        type: string
      publish:
        description: "Make the release and update GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "not a version: $env:VERSION" }
          (Get-Content Cargo.toml -Raw) -replace '(?m)^(\[workspace\.package\][^\[]*?version\s*=\s*")[^"]+', "`${1}$env:VERSION" | Set-Content Cargo.toml -NoNewline
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --release -p victory -p vi-launcher
      - name: Bundle
        shell: pwsh
        run: |
          $out = "bundle\windows-x64"
          New-Item -ItemType Directory -Force "$out\victory" | Out-Null
          Copy-Item target\release\vi-launcher.exe $out
          Copy-Item target\release\victory.exe "$out\victory"
          Copy-Item victory.example.toml, LICENSE, README.md $out
          Compress-Archive -Path "$out\*" -DestinationPath "VI-BR-PORT-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: VI-BR-PORT-${{ inputs.version }}-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: victory-exe
          path: target/release/victory.exe

  linux:
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          sed -i "/^\[workspace.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - name: Build
        run: cargo build --release -p vi-launcher
      - uses: actions/download-artifact@v4
        with:
          name: victory-exe
          path: victory-exe
      - name: Bundle
        run: |
          out=bundle/linux-x64
          mkdir -p "$out/victory"
          cp target/release/vi-launcher "$out/"
          cp victory-exe/victory.exe "$out/victory/"
          cp victory.example.toml LICENSE README.md "$out/"
          (cd "$out" && zip -r "../../VI-BR-PORT-$VERSION-linux-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: VI-BR-PORT-${{ inputs.version }}-linux-x64.zip
          if-no-files-found: error

  manifest:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: "*-x64"
          merge-multiple: true
      - name: latest.json
        env:
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$REPO/releases/download/v$VERSION"
          entry() {
            f="bundles/VI-BR-PORT-$VERSION-$1.zip"
            printf '"%s":{"url":"%s/%s","sha256":"%s","size":%s}' "$1" "$base" "$(basename "$f")" \
              "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c %s "$f")"
          }
          printf '{"format":1,"version":"%s","published":"%s","notes_url":"https://github.com/%s/releases/tag/v%s","assets":{%s,%s}}\n' \
            "$VERSION" "$(date -u +%F)" "$REPO" "$VERSION" "$(entry windows-x64)" "$(entry linux-x64)" > latest.json
          python3 -m json.tool latest.json
          sha256sum bundles/*.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: |
            latest.json
            SHA256SUMS

  publish:
    if: ${{ inputs.publish }}
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "VI-BR-PORT $VERSION" --generate-notes \
            out/VI-BR-PORT-*.zip out/latest.json out/SHA256SUMS

  pages:
    if: ${{ inputs.publish }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: manifest
          path: site
      - run: rm -f site/SHA256SUMS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
