name: Release

# Started by hand only. The launcher and the engine are released apart, each its
# own download, version and tag (or both in one run, as two releases):
#   launcher  v<version>          VI-BR-PORT-<version>-windows-x64.zip  vi-launcher.exe
#                                 VI-BR-PORT-<version>-linux-x64.zip    vi-launcher (it starts victory.exe
#                                                                       through Wine or Proton)
#                                 latest.json: each launcher bundle's address, size and SHA-256
#   engine    engine-v<version>   VIctory-<version>-windows-x64.zip     victory.exe (next to the launcher, chosen
#                                                                       in its settings, or with scripts/play.ps1)
# A dev channel run puts dev- before every name and tag and makes pre-releases.
# With publish off (the default) the bundles are only kept as artifacts to look at.
# With publish on the release(s) are made; a stable launcher release also puts
# latest.json on GitHub Pages, where the launchers look first. An engine release
# is never marked latest, so the launchers' fallback (the latest release) stays
# on a launcher release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, without the v (for example 0.2.0)"
        required: true
        type: string
      what:
        description: "What to release: the launcher, the engine, or both (two releases)"
        required: true
        type: choice
        options: [launcher, engine, both]
        default: both
      channel:
        description: "stable: plain names and tags, Pages updated. dev: names and tags start with dev-, pre-releases, Pages untouched"
        required: true
        type: choice
        options: [stable, dev]
        default: stable
      publish:
        description: "Make the release(s) and, for a stable launcher, update GitHub Pages"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}
  # Read by the builds when they are compiled: a dev build names itself so.
  VI_CHANNEL: ${{ inputs.channel == 'dev' && 'dev' || '' }}
  # The bundles' name prefix and the two releases' tags.
  PREFIX: ${{ inputs.channel == 'dev' && 'dev-' || '' }}
  TAG: ${{ inputs.channel == 'dev' && format('dev-v{0}', inputs.version) || format('v{0}', inputs.version) }}
  ENGINE_TAG: ${{ inputs.channel == 'dev' && format('dev-engine-v{0}', inputs.version) || format('engine-v{0}', inputs.version) }}
  LAUNCHER: ${{ inputs.what != 'engine' }}
  ENGINE: ${{ inputs.what != 'launcher' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') { throw "not a version: $env:VERSION" }
          (Get-Content Cargo.toml -Raw) -replace '(?m)^(\[workspace\.package\][^\[]*?version\s*=\s*")[^"]+', "`${1}$env:VERSION" | Set-Content Cargo.toml -NoNewline
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        shell: pwsh
        run: |
          $packages = @()
          if ($env:ENGINE -eq 'true') { $packages += @('-p', 'victory') }
          if ($env:LAUNCHER -eq 'true') { $packages += @('-p', 'vi-launcher') }
          cargo build --release @packages
      - name: Bundles
        shell: pwsh
        run: |
          if ($env:ENGINE -eq 'true') { scripts\build-bundle.ps1 -Version $env:VERSION -Channel ${{ inputs.channel }} -Built -Out bundle -NoLauncher }
          if ($env:LAUNCHER -eq 'true') { scripts\build-bundle.ps1 -Version $env:VERSION -Channel ${{ inputs.channel }} -Built -Out bundle }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: bundle/*.zip
          if-no-files-found: error

  linux:
    if: ${{ inputs.what != 'engine' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Version
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'
          sed -i "/^\[workspace.package\]/,/^\[/ s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libwayland-dev
      - name: Build
        run: cargo build --release -p vi-launcher
      - name: Bundle
        run: |
          out=bundle/linux-x64
          mkdir -p "$out"
          cp target/release/vi-launcher "$out/"
          cp LICENSE "$out/"
          (cd "$out" && zip -r "../${PREFIX}VI-BR-PORT-$VERSION-linux-x64.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: bundle/${{ env.PREFIX }}VI-BR-PORT-${{ inputs.version }}-linux-x64.zip
          if-no-files-found: error

  manifest:
    needs: [windows, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' && (needs.linux.result == 'success' || needs.linux.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: "*-x64"
          merge-multiple: true
      - name: latest.json and the sums
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p launcher engine
          # The launcher's manifest names only the launcher bundles.
          if [ "$LAUNCHER" = true ]; then
            base="https://github.com/$REPO/releases/download/$TAG"
            entries=()
            entry() {
              f="bundles/${PREFIX}VI-BR-PORT-$VERSION-$1.zip"
              [ -f "$f" ] || return 0
              entries+=("$(printf '"%s":{"url":"%s/%s","sha256":"%s","size":%s}' "$1" "$base" "$(basename "$f")" \
                "$(sha256sum "$f" | cut -d' ' -f1)" "$(stat -c %s "$f")")")
            }
            entry windows-x64
            entry linux-x64
            assets=$(IFS=,; echo "${entries[*]}")
            printf '{"format":1,"version":"%s","published":"%s","notes_url":"https://github.com/%s/releases/tag/%s","assets":{%s}}\n' \
              "$VERSION" "$(date -u +%F)" "$REPO" "$TAG" "$assets" > launcher/latest.json
            python3 -m json.tool launcher/latest.json
            (cd bundles && sha256sum ${PREFIX}VI-BR-PORT-*.zip) > launcher/SHA256SUMS
            cp bundles/${PREFIX}VI-BR-PORT-*.zip launcher/
          fi
          if [ "$ENGINE" = true ]; then
            (cd bundles && sha256sum ${PREFIX}VIctory-*.zip) > engine/SHA256SUMS
            cp bundles/${PREFIX}VIctory-*.zip engine/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            launcher
            engine

  publish:
    if: ${{ inputs.publish && !cancelled() && needs.manifest.result == 'success' }}
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out
      - name: GitHub release(s)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pre=()
          if [ "${{ inputs.channel }}" = dev ]; then pre=(--prerelease); fi
          if [ "$LAUNCHER" = true ]; then
            gh release create "$TAG" --repo "$REPO" --target "${{ github.sha }}" \
              --title "VI-BR-PORT launcher ${PREFIX}$VERSION" --generate-notes "${pre[@]}" \
              out/launcher/*.zip out/launcher/latest.json out/launcher/SHA256SUMS
          fi
          if [ "$ENGINE" = true ]; then
            gh release create "$ENGINE_TAG" --repo "$REPO" --target "${{ github.sha }}" --latest=false \
              --title "VIctory engine ${PREFIX}$VERSION" --generate-notes "${pre[@]}" \
              out/engine/*.zip out/engine/SHA256SUMS
          fi

  # Pages tells the launchers about a stable launcher release.
  pages:
    if: ${{ inputs.publish && inputs.what != 'engine' && inputs.channel == 'stable' && !cancelled() && needs.publish.result == 'success' }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: files
      - run: mkdir -p site && cp files/launcher/latest.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
